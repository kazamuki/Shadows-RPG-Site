# Single source of truth for the six Rules Preview pages, in reading order.
# Drives the Rules Preview hub grid, Home's Core Rulebook shortcut grid, each
# sub-page's status tag, and the prev/next pager at the bottom of each sub-page.
# Change a page's status here and every place it shows up updates together.
#
# status: draft | in-progress | final   (label is derived, see _includes/status-tag.html)
# image:  a CRB spread screenshot, OR leave it out and set `art:` instead — a short
#         glyph rendered on a designed panel. Don't reuse the same image on two cards;
#         it reads as a copy-paste mistake rather than a choice.

