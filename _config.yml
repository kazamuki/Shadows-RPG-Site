title: Shadows RPG
description: >-
  A cybernetic, supernatural roleplaying game set in NYTE City, 2099 — the public preview
  layer for the Shadows Core Rulebook.
url: "https://kazamuki.github.io"
baseurl: "/Shadows-RPG-Site"
# TEMPORARY: GitHub Pages is currently serving this as a project page
# (kazamuki.github.io/Shadows-RPG-Site/), not the shadowsrpg.com custom domain, which is why
# baseurl isn't empty. Once a CNAME file + DNS point shadowsrpg.com at this repo, change url to
# "https://shadowsrpg.com" and baseurl back to "" — a project-page baseurl breaks every asset
# and internal link on a root custom domain.

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty

# Reference/working docs live alongside the site source in this repo but aren't part of
# the published site — keep Jekyll from trying to build them as pages.
exclude:
  - content/
  - brand/
  - Google-Page-Original/
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/

social:
  twitch: https://twitch.tv/d33kode
  patreon: https://patreon.com/d33kode
  twitter: https://twitter.com/Shadows_RPG
  youtube: https://www.youtube.com/@d33kode

defaults:
  - scope:
      path: ""
    values:
      layout: default
